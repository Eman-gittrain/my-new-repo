name: Website Deployment
on:
  push:
    branches:
      - main
jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - name: Get code
        uses: actions/checkout@v3
      - name: Cache dependencies
        id: cache
        uses: actions/cache@v3
        with:
          path: node-modules
          key: deps-node-modules-${{ hashFiles('**/package-lock.json') }}
      - name: Install dependencies
        run: npm ci
      - name: Lint code
        run: npm run lint
  test:
    needs: lint
    runs-on: ubuntu-latest
    steps:
      - name: Get code
        uses: actions/checkout@v3
      - name: Cache dependencies
        id: cache
        uses: actions/cache@v3
        with:
          path: node-modules
          key: deps-node-modules-${{ hashFiles('**/package-lock.json') }}
      - name: Install depedencies
        run: npm ci
      - name: Test code
        continue-on-error: true
        id: ran-step
        run: npm run test
      - name: Upload test rprt
        uses: actions/upload-artifact@v4
        with:
          name: test-report
          path: test.json
  report:
    needs: [lint, test]
    if: failure()
    runs-on: ubuntu-latest
    steps:
      - name: print info
        run:
          echo something went wrong